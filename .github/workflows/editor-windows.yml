# 在 GitHub 的 Windows 机器上打编辑器安装包（不需要签名证书；首次运行 Windows 会提示“未知发布者”）。
# 推送 v* 标签时，安装包上传到同名 Release；手动运行时作为构建产物保存。
name: editor-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: chener-editor-setup
          path: release/*.exe
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
